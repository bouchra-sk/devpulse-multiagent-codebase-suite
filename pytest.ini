[pytest]
# Dossiers de tests
testpaths = tests backend/Agent4

# Préfixes des fichiers de tests
python_files = test_*.py *_test.py

# Préfixes des fonctions de tests
python_functions = test_*

# Préfixes des classes de tests
python_classes = Test*

# Affichage court des assertions
addopts = -v --tb=short

# Note : les variables d'environnement (FORCE_MOCK_LLM, LLM_API_KEY factice)
# sont injectées via conftest.py (os.environ.setdefault) — pas besoin de
# pytest-env.
